<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game of Life</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="container py-4 text-center">
    <h1 class="mb-4">Conway's Game of Life</h1>
    <a href="dashboard.php" class="btn btn-outline-primary mb-3">🏠 Back to Dashboard</a>

    <!-- Speed selector -->
    <div class="mb-2">
      Speed:
      <select id="speedSelect" class="form-select w-auto d-inline-block">
        <option value="100">Fast</option>
        <option value="300" selected>Normal</option>
        <option value="600">Slow</option>
      </select>
    </div>

    <!-- Controls -->
    <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">
      <button class="btn btn-success" onclick="startGame()">▶ Start</button>
      <button class="btn btn-warning" onclick="stopGame()">⏸ Stop</button>
      <button class="btn btn-primary" onclick="nextGen()">+1 Gen</button>
      <button class="btn btn-info" onclick="next23()">+23 Gen</button>
      <button class="btn btn-danger" onclick="resetGame()">♻ Reset</button>

      <select class="form-select w-auto" id="patternSelect" onchange="loadPattern(this.value)">
        <option value="">Select Pattern</option>
        <option value="block">Block (Still Life)</option>
        <option value="blinker">Blinker (Oscillator)</option>
        <option value="beacon">Beacon (Oscillator)</option>
        <option value="glider">Glider (Bonus)</option>
      </select>
    </div>

    <!-- Status and generation -->
    <div id="status" class="my-2 fw-bold text-danger">🔴 Game is stopped</div>
    <div id="generation" class="mb-3 fw-semibold">Generation: 0</div>

    <!-- Main grid -->
    <div class="row justify-content-center">
      <div class="col-auto">
        <div id="grid" class="border border-secondary"></div>
      </div>
    </div>

    <!-- React Snapshots -->
    <h4 class="mt-4">React Snapshots</h4>
    <div class="row justify-content-center mb-4">
      <div class="col-md-5">
        <h6>🟢 Before Start</h6>
        <div id="react-snapshot-before"></div>
      </div>
      <div class="col-md-5">
        <h6>🔴 After Stop</h6>
        <div id="react-snapshot-after"></div>
      </div>
    </div>
  </div>

  <!-- ✅ Session Logging + Speed Control Script -->
  <script>
    // ✅ Format date to MySQL DATETIME format
    function formatMySQLDatetime(date) {
      return date.toISOString().slice(0, 19).replace('T', ' ');
    }

    let gameStartTime = null;
    let generationCount = 0;

    function logGameSession() {
      if (!gameStartTime) return;
      const endTime = formatMySQLDatetime(new Date());

      fetch('log_session.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: `start_time=${encodeURIComponent(gameStartTime)}&end_time=${encodeURIComponent(endTime)}&generations=${generationCount}`
      })
      .then(res => res.text())
      .then(msg => console.log('[LOG]', msg));

      gameStartTime = null;
    }

    // Speed Change Handling
    document.getElementById("speedSelect").addEventListener("change", () => {
      if (window.gameRunning && window.interval) {
        clearInterval(window.interval);
        const newSpeed = parseInt(document.getElementById("speedSelect").value);
        window.interval = setInterval(window.nextGeneration, newSpeed);
      }
    });

    // Hooks for script.js
    window.setStartSession = () => {
      gameStartTime = formatMySQLDatetime(new Date());
      generationCount = 0;
    };
    window.incrementGeneration = () => {
      generationCount++;
    };
    window.setStopSession = () => {
      logGameSession();
    };
  </script>

  <script src="react.js"></script>
  <script src="script.js"></script>
</body>
</html>
